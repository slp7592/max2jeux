<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un Max de jeux</title>
<meta name="description" content="Un Max de jeux : une collection de mini-jeux gratuits à jouer dans le navigateur.">
<style>
  :root{
    --bg:#140b2e; --panel:#1f1247; --panel2:#2a1860; --line:rgba(255,255,255,.12);
    --txt:#f4efff; --muted:#b9a8e6; --accent:#ffd23f; --accent2:#8dff7a; --hot:#ff4d7a;
    --side:300px; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Trebuchet MS",Verdana,system-ui,sans-serif}
  body{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:100%;overflow:hidden}

  /* ---------- Barre latérale ---------- */
  aside{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,var(--panel),#170d38);
    border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px;text-decoration:none;color:inherit}
  .logo{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;
    background:conic-gradient(from 200deg,var(--hot),var(--accent),var(--accent2),#4dd2ff,#c77dff,var(--hot));
    box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:24px;transform:rotate(-6deg)}
  .brand h1{margin:0;font-size:22px;line-height:1.05;letter-spacing:.3px}
  .brand h1 span{display:block;color:var(--accent);font-size:28px}
  .search{margin:4px 16px 12px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 34px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.25);color:var(--txt);font:inherit;font-size:15px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7}
  .count{padding:0 18px 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  nav{flex:1;overflow-y:auto;padding:0 10px 16px;scrollbar-width:thin;scrollbar-color:var(--panel2) transparent}
  nav a{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:6px;border-radius:12px;
    text-decoration:none;color:var(--txt);border:1px solid transparent;transition:background .15s,transform .15s}
  nav a:hover{background:rgba(255,255,255,.06);transform:translateX(3px)}
  nav a.active{background:var(--panel2);border-color:rgba(255,210,63,.55);box-shadow:inset 4px 0 0 var(--accent)}
  .num{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:bold;
    font-size:16px;color:#1b1035;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .info{min-width:0}
  .info b{display:block;font-size:15px;line-height:1.25}
  .info small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg{padding:14px;color:var(--muted);font-size:14px;line-height:1.45}
  .msg code{color:var(--accent)}
  .skel{height:58px;margin-bottom:6px;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));
    background-size:200% 100%;animation:sh 1.2s infinite linear}
  @keyframes sh{to{background-position:-200% 0}}
  footer{padding:10px 18px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}

  /* ---------- Zone de jeu ---------- */
  main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px;gap:12px}
  .bar{display:flex;align-items:center;gap:10px;min-height:40px}
  .bar h2{margin:0;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar button,.bar a.btn{flex:none;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font:inherit;font-size:14px;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px}
  .bar button:hover,.bar a.btn:hover{background:var(--panel2);border-color:var(--accent)}
  .bar .tools{display:flex;gap:8px}
  .bar[data-empty] .tools{display:none}
  #menu{display:none}
  .frame{position:relative;flex:1;min-height:0;border-radius:var(--radius);overflow:hidden;background:#000;
    border:2px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
  .welcome{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;
    background:radial-gradient(circle at 30% 20%,#3a1c8c,transparent 60%),radial-gradient(circle at 80% 90%,#d65db1aa,transparent 55%),var(--bg)}
  .welcome .logo{width:110px;height:110px;font-size:58px;border-radius:30px;margin:0 auto 18px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:rotate(6deg) translateY(-8px)}}
  .welcome h2{font-size:40px;margin:0 0 8px}
  .welcome h2 span{color:var(--accent)}
  .welcome p{color:var(--muted);font-size:17px;margin:0 0 22px}
  .welcome button{padding:13px 24px;border-radius:14px;border:0;background:var(--accent);color:#1b1035;
    font:inherit;font-weight:bold;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #b8901a}
  .welcome button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8901a}
  .hidden{display:none!important}

  /* ---------- Mobile ---------- */
  @media (max-width:800px){
    body{grid-template-columns:1fr}
    aside{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:20;transform:translateX(-100%);
      transition:transform .25s;box-shadow:10px 0 40px rgba(0,0,0,.5)}
    body.open aside{transform:none}
    body.open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
    #menu{display:inline-flex}
    main{padding:8px;gap:8px}
    .bar h2{font-size:17px}
    .bar .lbl{display:none}
    .welcome h2{font-size:30px}
  }
</style>
</head>
<body>

<aside>
  <a class="brand" href="./" title="Accueil">
    <div class="logo">🎮</div>
    <h1>Un Max<span>de jeux</span></h1>
  </a>
  <label class="search"><input id="q" type="search" placeholder="Chercher un jeu…" autocomplete="off"></label>
  <div class="count" id="count">Chargement…</div>
  <nav id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></nav>
  <footer>Mini-jeux gratuits · jouables au clavier ou au doigt</footer>
</aside>

<main>
  <div class="bar" id="bar" data-empty>
    <button id="menu" aria-label="Liste des jeux">☰</button>
    <h2 id="title">Bienvenue !</h2>
    <div class="tools">
      <button id="reload" title="Recommencer">↻ <span class="lbl">Recommencer</span></button>
      <a class="btn" id="newtab" target="_blank" rel="noopener" title="Ouvrir dans un nouvel onglet">↗ <span class="lbl">Onglet</span></a>
      <button id="full" title="Plein écran">⛶ <span class="lbl">Plein écran</span></button>
    </div>
  </div>
  <div class="frame" id="frameBox">
    <iframe id="game" title="Jeu" allow="fullscreen; autoplay; gamepad" class="hidden"></iframe>
    <div class="welcome" id="welcome">
      <div>
        <div class="logo">🎮</div>
        <h2>Un Max <span>de jeux</span></h2>
        <p>Choisis un jeu dans la liste et c'est parti !</p>
        <button id="random">🎲 Jeu au hasard</button>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
"use strict";

/* =====================================================================
   DÉCOUVERTE AUTOMATIQUE DES JEUX
   Tous les fichiers .html du dossier (sauf index.html) sont des jeux.
   1) Sur GitHub Pages : on demande la liste des fichiers à l'API GitHub
      (propriétaire et dépôt déduits de l'adresse du site).
   2) Sinon (ou si l'API échoue) : on essaie 01.html, 02.html, 03.html…
      jusqu'à ne plus rien trouver.
   Le nom affiché vient de la balise <title> de chaque jeu, et la petite
   description de <meta name="description" content="…"> si elle existe.
   ===================================================================== */

const EXCLUDE = new Set(["index.html", "404.html"]);
const CACHE_KEY = "umdj-games-v1";
const CACHE_MS = 10 * 60 * 1000;   // 10 min, pour ménager l'API GitHub
const COLORS = ["#ff4d7a","#ffd23f","#8dff7a","#4dd2ff","#c77dff","#ff9f43","#6ff3ff","#ff8fb0"];

const $ = id => document.getElementById(id);
const els = {
  list:$("list"), count:$("count"), q:$("q"), title:$("title"), bar:$("bar"),
  game:$("game"), welcome:$("welcome"), newtab:$("newtab"), box:$("frameBox")
};
let games = [];

const sortFiles = arr => arr.sort((a,b) => a.localeCompare(b, "fr", {numeric:true}));
const baseDir = () => location.pathname.replace(/[^/]*$/, "");   // ex. /mon-depot/jeux/

async function listFromGitHub(){
  const host = location.hostname;
  if (!host.endsWith(".github.io")) return null;
  const owner = host.split(".")[0];
  const parts = baseDir().split("/").filter(Boolean);
  // Deux cas possibles : site « projet » (owner.github.io/depot/…) ou site « utilisateur » (dépôt owner.github.io)
  const tries = [];
  if (parts.length) tries.push([parts[0], parts.slice(1).join("/")]);
  tries.push([owner + ".github.io", parts.join("/")]);
  for (const [repo, sub] of tries){
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${sub}`,
                          {headers:{Accept:"application/vnd.github+json"}});
    if (r.status === 404) continue;
    if (!r.ok) throw new Error("API GitHub " + r.status);
    const data = await r.json();
    if (!Array.isArray(data)) continue;
    return sortFiles(data.filter(f => f.type === "file" && /\.html?$/i.test(f.name) && !EXCLUDE.has(f.name.toLowerCase()))
                         .map(f => f.name));
  }
  return null;
}

async function exists(name){
  try { const r = await fetch(name, {method:"HEAD", cache:"no-store"}); return r.ok; }
  catch { return false; }
}
async function listByProbing(){
  const found = [];
  let misses = 0;
  for (let i = 1; i <= 999 && misses < 3; i++){
    const name = String(i).padStart(2, "0") + ".html";
    if (await exists(name)) { found.push(name); misses = 0; } else misses++;
  }
  return found;
}

async function readMeta(file){
  const fallback = {file, title: prettify(file), desc: ""};
  try {
    const r = await fetch(file);
    if (!r.ok) return fallback;
    const doc = new DOMParser().parseFromString(await r.text(), "text/html");
    const t = doc.querySelector("title")?.textContent.trim();
    const d = doc.querySelector('meta[name="description"]')?.getAttribute("content")?.trim();
    return {file, title: t || fallback.title, desc: d || ""};
  } catch { return fallback; }
}
const prettify = f => f.replace(/\.html?$/i, "").replace(/[-_]+/g, " ").replace(/^\w/, c => c.toUpperCase());

async function discover(){
  try {
    const c = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < CACHE_MS) return c.games;
  } catch {}
  let files = null;
  try { files = await listFromGitHub(); } catch (e) { console.warn(e); }
  if (!files || !files.length) files = await listByProbing();
  const list = await Promise.all(files.map(readMeta));
  try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), games: list})); } catch {}
  return list;
}

/* ============================ AFFICHAGE ============================ */

const idOf = g => g.file.replace(/\.html?$/i, "");

function renderList(){
  const q = els.q.value.trim().toLowerCase();
  const shown = games.filter(g => !q || (g.title + " " + g.desc).toLowerCase().includes(q));
  els.list.innerHTML = "";
  shown.forEach(g => {
    const i = games.indexOf(g);
    const a = document.createElement("a");
    a.href = "#" + encodeURIComponent(idOf(g));
    a.dataset.id = idOf(g);
    const label = /^\d+$/.test(idOf(g)) ? idOf(g) : String(i + 1).padStart(2, "0");
    a.innerHTML = `<div class="num" style="background:${COLORS[i % COLORS.length]}">${label}</div>
      <div class="info"><b></b><small></small></div>`;
    a.querySelector("b").textContent = g.title;
    a.querySelector("small").textContent = g.desc || g.file;
    els.list.appendChild(a);
  });
  if (!shown.length) els.list.innerHTML = `<div class="msg">Aucun jeu ne correspond à « ${escapeHtml(q)} ».</div>`;
  els.count.textContent = games.length + (games.length > 1 ? " jeux" : " jeu");
  markActive();
}
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function markActive(){
  const id = currentId();
  els.list.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.dataset.id === id));
}
const currentId = () => decodeURIComponent(location.hash.slice(1));

function route(){
  const id = currentId();
  const g = games.find(x => idOf(x) === id);
  document.body.classList.remove("open");
  if (!g){
    els.game.classList.add("hidden"); els.game.removeAttribute("src");
    els.welcome.classList.remove("hidden");
    els.title.textContent = "Bienvenue !"; els.bar.setAttribute("data-empty", "");
    document.title = "Un Max de jeux";
  } else {
    els.welcome.classList.add("hidden");
    els.game.classList.remove("hidden");
    if (els.game.getAttribute("src") !== g.file) els.game.src = g.file;
    els.title.textContent = g.title; els.bar.removeAttribute("data-empty");
    els.newtab.href = g.file;
    document.title = g.title + " · Un Max de jeux";
  }
  markActive();
}

// Donne le focus clavier au jeu (sinon les flèches font défiler la page)
els.game.addEventListener("load", () => { try { els.game.contentWindow.focus(); } catch {} });
els.box.addEventListener("pointerdown", () => { try { els.game.contentWindow.focus(); } catch {} });

$("reload").onclick = () => { const s = els.game.getAttribute("src"); els.game.src = "about:blank"; setTimeout(() => els.game.src = s, 30); };
$("full").onclick = () => {
  const el = els.box;
  (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  setTimeout(() => { try { els.game.contentWindow.focus(); } catch {} }, 100);
};
$("menu").onclick = () => document.body.classList.toggle("open");
document.addEventListener("click", e => { if (document.body.classList.contains("open") && !e.target.closest("aside,#menu")) document.body.classList.remove("open"); });
$("random").onclick = () => { if (games.length) location.hash = idOf(games[Math.floor(Math.random() * games.length)]); };
els.q.addEventListener("input", renderList);
addEventListener("hashchange", route);

(async () => {
  if (location.protocol === "file:"){
    els.list.innerHTML = `<div class="msg">La détection automatique ne fonctionne pas en ouvrant le fichier directement.
      Teste en ligne sur GitHub Pages, ou lance un petit serveur local dans le dossier
      (ex. <code>python -m http.server</code>) puis ouvre <code>http://localhost:8000</code>.</div>`;
    els.count.textContent = "Mode fichier local";
    return;
  }
  games = await discover();
  if (!games.length){
    els.list.innerHTML = `<div class="msg">Aucun jeu trouvé dans ce dossier.</div>`;
    els.count.textContent = "0 jeu";
    return;
  }
  renderList();
  route();
})();
})();
</script>
</body>
</html>
