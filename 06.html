<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Serpent Labyrinthe Rigolo</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b1b4d;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #pad{position:fixed;right:14px;bottom:14px;width:180px;height:180px;display:none;z-index:5;touch-action:none}
  #pad button{position:absolute;width:56px;height:56px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.28);color:#fff;font-size:26px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent;touch-action:none}
  #pad button:active{background:rgba(255,255,255,.55);transform:translateY(2px)}
  #bu{left:62px;top:0}#bd{left:62px;bottom:0}#bl{left:0;top:62px}#br{right:0;top:62px}
  #mute{position:fixed;left:12px;bottom:12px;z-index:5;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.25);color:#fff;font-size:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad">
  <button id="bu">▲</button><button id="bl">◀</button><button id="br">▶</button><button id="bd">▼</button>
</div>
<button id="mute" title="Son">🔊</button>
<script>
(()=>{
"use strict";
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener("resize",resize);

/* ---------- Audio ---------- */
let AC=null,muted=false;
function initAudio(){
  if(!AC){
    try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}
  }
  if(AC&&AC.state==="suspended")AC.resume();
}
function beep(f1,f2,dur,type,vol){
  if(!AC||muted)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine";
  o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol||0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+0.02);
}
const sfx={
  eat(){beep(500,900,0.12,"square",0.12);},
  gold(){beep(700,1400,0.1,"triangle",0.16);setTimeout(()=>beep(900,1800,0.15,"triangle",0.16),90);},
  level(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,f*1.02,0.15,"triangle",0.16),i*90));},
  bonk(){beep(220,60,0.35,"sawtooth",0.18);},
  bump(){beep(200,90,0.16,"sawtooth",0.09);},
  move(){beep(260,240,0.025,"sine",0.025);},
  tick(){beep(900,880,0.05,"square",0.06);},
  start(){beep(400,800,0.2,"square",0.12);}
};
document.getElementById("mute").addEventListener("click",e=>{
  initAudio();muted=!muted;e.target.textContent=muted?"🔇":"🔊";e.target.blur();
});

/* ---------- Etat ---------- */
const STATE={TITLE:0,PLAY:1,OVER:2};
let state=STATE.TITLE;
let best=0,score=0,level=1;
let COLS=17,ROWS=13,cell=32,offX=0,offY=0;
let maze=[],snake=[],dir={x:1,y:0},food=null,gold=null,goldTimer=0;
let stepTime=0.12,moveCd=0,fruitsInLevel=0,fruitsNeeded=5;
let timeLeft=35,timeMax=45,started=false,lastTickSec=-1;
let particles=[],floaters=[],shake=0,time=0,flash=0;
let stars=[];
let grow=0,wobble=0;
let held=[],tapQueue=[];

// taille de grille idéale pour l'écran actuel
function computeGrid(){
  const availW=W-16,availH=H-70;
  const baseC=Math.max(11,Math.min(21,Math.floor(availW/28)));
  let c=Math.floor(Math.min(availW/baseC,availH/13));
  cell=Math.max(18,Math.min(c,48));
  COLS=Math.max(11,Math.floor(availW/cell));
  ROWS=Math.max(9,Math.floor(availH/cell));
  if(COLS%2===0)COLS--;
  if(ROWS%2===0)ROWS--;
  if(COLS>25)COLS=25;
  if(ROWS>19)ROWS=19;
}
// taille des cases et position de la grille à l'écran
function fitGrid(){
  const availW=W-16,availH=H-70;
  cell=Math.max(4,Math.floor(Math.min(availW/COLS,availH/ROWS)));
  offX=Math.floor((W-COLS*cell)/2);
  offY=Math.floor(60+(H-60-ROWS*cell)/2);
}
function layout(){
  const mobile=("ontouchstart" in window)||navigator.maxTouchPoints>0;
  // Pendant une partie (ou sur l'écran de fin), on garde le labyrinthe en cours :
  // seul le zoom change. Avant, un redimensionnement (rotation du téléphone…)
  // relançait la partie, ou faisait planter le jeu sur l'écran de fin.
  if(maze.length&&state!==STATE.TITLE){ROWS=maze.length;COLS=maze[0].length;}
  else computeGrid();
  fitGrid();
  if(stars.length===0){
    for(let i=0;i<50;i++)stars.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2,p:Math.random()*6});
  }
  if(mobile)document.getElementById("pad").style.display="block";
}

/* ---------- Labyrinthe ---------- */
function genMaze(){
  const m=[];
  for(let y=0;y<ROWS;y++){m.push(new Array(COLS).fill(1));}
  const stack=[[1,1]];m[1][1]=0;
  while(stack.length){
    const [cx,cy]=stack[stack.length-1];
    const n=[];
    [[2,0],[-2,0],[0,2],[0,-2]].forEach(d=>{
      const nx=cx+d[0],ny=cy+d[1];
      if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&m[ny][nx]===1)n.push(d);
    });
    if(!n.length){stack.pop();continue;}
    const d=n[Math.floor(Math.random()*n.length)];
    m[cy+d[1]/2][cx+d[0]/2]=0;
    m[cy+d[1]][cx+d[0]]=0;
    stack.push([cx+d[0],cy+d[1]]);
  }
  const holes=Math.floor(COLS*ROWS/(level<3?14:22));
  for(let i=0;i<holes;i++){
    const x=1+Math.floor(Math.random()*(COLS-2)),y=1+Math.floor(Math.random()*(ROWS-2));
    if(m[y][x]===1){
      const h=(m[y][x-1]===0&&m[y][x+1]===0&&m[y-1][x]===1&&m[y+1][x]===1);
      const v=(m[y-1][x]===0&&m[y+1][x]===0&&m[y][x-1]===1&&m[y][x+1]===1);
      if(h||v)m[y][x]=0;
    }
  }
  return m;
}
function freeCells(){
  const a=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(maze[y][x]===0&&!snake.some(s=>s.x===x&&s.y===y)&&!(food&&food.x===x&&food.y===y)&&!(gold&&gold.x===x&&gold.y===y))a.push({x,y});
  }
  return a;
}
function placeFood(){
  const f=freeCells();
  if(!f.length){food=null;return;}
  const far=f.filter(c=>Math.abs(c.x-snake[0].x)+Math.abs(c.y-snake[0].y)>4);
  const arr=far.length?far:f;
  const c=arr[Math.floor(Math.random()*arr.length)];
  const kinds=["🍎","🍓","🍌","🍪","🍇","🍩"];
  food={x:c.x,y:c.y,k:kinds[Math.floor(Math.random()*kinds.length)],born:time};
}
function placeGold(){
  const f=freeCells();
  if(!f.length)return;
  const c=f[Math.floor(Math.random()*f.length)];
  gold={x:c.x,y:c.y};goldTimer=12;
}
function fruitBonus(){return Math.max(2.5,5-level*0.25);}

function newLevel(){
  // nouveau labyrinthe adapté à la taille actuelle de l'écran
  computeGrid();fitGrid();
  maze=genMaze();
  dir={x:1,y:0};
  if(maze[1][2]!==0)dir={x:0,y:1};
  snake=[{x:1,y:1}];
  grow=2;
  tapQueue=[];
  food=null;gold=null;goldTimer=0;
  fruitsInLevel=0;
  fruitsNeeded=4+Math.min(level,8);
  stepTime=Math.max(0.09,0.125-level*0.003);
  moveCd=0;
  started=false;
  lastTickSec=-1;
  placeFood();
}
function newGame(){
  score=0;level=1;particles=[];floaters=[];
  timeLeft=35;timeMax=45;
  newLevel();
  state=STATE.PLAY;
  sfx.start();
}

/* ---------- Entrées : le joueur dirige le serpent ---------- */
function press(id,dx,dy){
  if(state!==STATE.PLAY)return;
  held=held.filter(h=>h.id!==id);
  held.push({id,x:dx,y:dy});
  if(tapQueue.length<2)tapQueue.push({x:dx,y:dy});
}
function release(id){held=held.filter(h=>h.id!==id);}
function activeDir(){return held.length?held[held.length-1]:null;}
function action(){
  initAudio();
  if(state===STATE.TITLE||state===STATE.OVER){held=[];newGame();}
}
function keyDir(k){
  if(k==="arrowup"||k==="w"||k==="z")return [0,-1];
  if(k==="arrowdown"||k==="s")return [0,1];
  if(k==="arrowleft"||k==="a"||k==="q")return [-1,0];
  if(k==="arrowright"||k==="d")return [1,0];
  return null;
}
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  const d=keyDir(k);
  if(d){
    initAudio();e.preventDefault();
    if(!e.repeat)press("k"+k,d[0],d[1]);
  }else if(k===" "||k==="enter"){
    e.preventDefault();
    if(!e.repeat)action();
  }
});
window.addEventListener("keyup",e=>{release("k"+e.key.toLowerCase());});
window.addEventListener("blur",()=>{held=[];});

function bindBtn(id,dx,dy){
  const b=document.getElementById(id);
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();initAudio();
    if(state===STATE.PLAY)press("b"+id,dx,dy);else action();
  });
  const up=e=>{e.preventDefault();release("b"+id);};
  b.addEventListener("pointerup",up);
  b.addEventListener("pointerleave",up);
  b.addEventListener("pointercancel",up);
}
bindBtn("bu",0,-1);bindBtn("bd",0,1);bindBtn("bl",-1,0);bindBtn("br",1,0);

// glisser le doigt sur l'écran : le serpent avance tant que le doigt reste posé
let anchor=null,swipeName=null;
cv.addEventListener("pointerdown",e=>{
  initAudio();
  if(state!==STATE.PLAY){action();return;}
  anchor={x:e.clientX,y:e.clientY};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener("pointermove",e=>{
  if(!anchor||state!==STATE.PLAY)return;
  const dx=e.clientX-anchor.x,dy=e.clientY-anchor.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18){
    if(Math.abs(dx)>Math.abs(dy))press("swipe",dx>0?1:-1,0);else press("swipe",0,dy>0?1:-1);
    anchor={x:e.clientX,y:e.clientY};
  }
});
function endSwipe(){anchor=null;release("swipe");}
cv.addEventListener("pointerup",endSwipe);
cv.addEventListener("pointercancel",endSwipe);

/* ---------- Particules ---------- */
function burst(x,y,color,n,speed){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(0.3+Math.random())*speed;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:0.6+Math.random()*0.5,max:1.1,c:color,r:2+Math.random()*4});
  }
}
function floater(x,y,t,c){floaters.push({x,y,t,c,life:1});}

/* ---------- Logique ---------- */
function bump(head){
  const px=offX+(head.x+.5)*cell,py=offY+(head.y+.5)*cell;
  shake=Math.max(shake,0.18);
  burst(px,py,"#ffffff",6,90);
  sfx.bump();
  moveCd=0.25;
  if(started){
    timeLeft-=1;
    floater(px,py-cell*0.5,"-1 s","#ffb3b3");
  }
}
function tryMove(d){
  const head=snake[0];
  const nx=head.x+d.x,ny=head.y+d.y;
  // reculer sur son cou : on ignore simplement
  if(snake.length>1&&snake[1].x===nx&&snake[1].y===ny)return false;
  dir={x:d.x,y:d.y};
  const hitWall=nx<0||ny<0||nx>=COLS||ny>=ROWS||maze[ny][nx]===1;
  if(hitWall){bump(head);return false;}
  const body=grow>0?snake:snake.slice(0,-1);
  if(body.some(s=>s.x===nx&&s.y===ny)){bump(head);return false;}
  started=true;
  snake.unshift({x:nx,y:ny});
  if(grow>0)grow--;else snake.pop();
  wobble=1;
  sfx.move();
  if(food&&food.x===nx&&food.y===ny){
    score+=10;fruitsInLevel++;grow+=1;
    const bonus=fruitBonus();
    timeLeft=Math.min(timeMax,timeLeft+bonus);
    const fx=offX+(nx+.5)*cell,fy=offY+(ny+.5)*cell;
    burst(fx,fy,"#ffd23f",14,160);burst(fx,fy,"#ff6fb5",8,120);
    floater(fx,fy,"+10  +"+bonus.toFixed(1).replace(/\.0$/,"")+"s","#fff");
    sfx.eat();
    food=null;
    if(score>best)best=score;
    if(fruitsInLevel>=fruitsNeeded){levelUp();return true;}
    placeFood();
    if(!gold&&Math.random()<0.25)placeGold();
  }else if(gold&&gold.x===nx&&gold.y===ny){
    score+=30;grow+=2;
    timeLeft=Math.min(timeMax,timeLeft+6);
    const fx=offX+(nx+.5)*cell,fy=offY+(ny+.5)*cell;
    burst(fx,fy,"#fff176",24,220);
    floater(fx,fy,"+30 ⭐ +6s","#fff176");
    sfx.gold();
    gold=null;
  }
  if(score>best)best=score;
  return true;
}
function levelUp(){
  level++;score+=50;
  if(score>best)best=score;
  sfx.level();
  flash=1;
  burst(W/2,H/2,"#7cf",30,300);burst(W/2,H/2,"#fc4",30,300);
  const keep=Math.min(timeMax,timeLeft+12);
  newLevel();
  timeLeft=keep;
  floater(W/2,H/2,"Niveau "+level+" !","#fff");
}
function gameOver(){
  state=STATE.OVER;
  held=[];tapQueue=[];
  shake=0.5;
  sfx.bonk();
  const h=snake[0];
  const px=offX+(h.x+.5)*cell,py=offY+(h.y+.5)*cell;
  burst(px,py,"#ff8a65",30,260);
  burst(px,py,"#fff",12,160);
  if(score>best)best=score;
}

function update(dt){
  time+=dt;
  if(state===STATE.PLAY){
    moveCd=Math.max(0,moveCd-dt);
    if(moveCd<=0){
      let d=tapQueue.shift()||activeDir();
      if(d){
        const moved=tryMove(d);
        if(state===STATE.PLAY&&moved)moveCd=stepTime;
      }
    }
    if(state===STATE.PLAY){
      if(started){
        timeLeft-=dt;
        const sec=Math.ceil(timeLeft);
        if(timeLeft<=5&&sec!==lastTickSec&&sec>0){lastTickSec=sec;sfx.tick();}
        if(timeLeft<=0){timeLeft=0;gameOver();}
      }
      if(gold){goldTimer-=dt;if(goldTimer<=0)gold=null;}
    }
  }
  if(shake>0)shake=Math.max(0,shake-dt);
  if(flash>0)flash=Math.max(0,flash-dt*1.5);
  wobble=Math.max(0,wobble-dt*6);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.life-=dt*0.9;f.y-=40*dt;
    if(f.life<=0)floaters.splice(i,1);
  }
}

/* ---------- Dessin ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#4a2a8a");g.addColorStop(1,"#1e2b6b");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    const a=0.4+0.6*Math.abs(Math.sin(time*1.5+s.p));
    ctx.fillStyle="rgba(255,255,255,"+a.toFixed(2)+")";
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.3);ctx.fill();
  }
}
function drawMaze(){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.5)";ctx.shadowBlur=20;ctx.shadowOffsetY=6;
  rr(offX-6,offY-6,COLS*cell+12,ROWS*cell+12,14);
  ctx.fillStyle="#ffe9a8";ctx.fill();
  ctx.restore();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const px=offX+x*cell,py=offY+y*cell;
    if(maze[y][x]===0){
      ctx.fillStyle=((x+y)%2)?"#fff3c4":"#ffeaa0";
      ctx.fillRect(px,py,cell,cell);
    }
  }
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(maze[y][x]!==1)continue;
    const px=offX+x*cell,py=offY+y*cell;
    const hue=(level*40+(x*7+y*13)%30)%360;
    ctx.fillStyle="hsl("+(150+hue%60)+",55%,38%)";
    rr(px+1,py+1,cell-2,cell-2,cell*0.25);ctx.fill();
    const g=ctx.createLinearGradient(px,py,px,py+cell);
    g.addColorStop(0,"rgba(255,255,255,.35)");g.addColorStop(.5,"rgba(255,255,255,0)");
    ctx.fillStyle=g;rr(px+1,py+1,cell-2,cell-2,cell*0.25);ctx.fill();
    if((x*31+y*17)%5===0){
      ctx.fillStyle="rgba(255,255,255,.35)";
      ctx.beginPath();ctx.arc(px+cell*0.3,py+cell*0.3,cell*0.08,0,6.3);ctx.fill();
    }
  }
}
function drawFood(){
  if(food){
    const cx=offX+(food.x+.5)*cell,cy=offY+(food.y+.5)*cell;
    const b=Math.sin((time-food.born)*5)*cell*0.06;
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,.15)";
    ctx.beginPath();ctx.ellipse(cx,cy+cell*0.35,cell*0.28,cell*0.1,0,0,6.3);ctx.fill();
    ctx.font=Math.floor(cell*0.78)+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(food.k,cx,cy+b);
    ctx.restore();
  }
  if(gold){
    const cx=offX+(gold.x+.5)*cell,cy=offY+(gold.y+.5)*cell;
    const blink=goldTimer<3&&Math.floor(time*8)%2===0;
    if(!blink){
      ctx.save();
      ctx.translate(cx,cy);ctx.rotate(Math.sin(time*3)*0.3);
      const s=1+Math.sin(time*6)*0.1;ctx.scale(s,s);
      ctx.shadowColor="#fff176";ctx.shadowBlur=16;
      ctx.fillStyle="#ffd600";
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const r=i%2?cell*0.2:cell*0.44,a=-Math.PI/2+i*Math.PI/5;
        ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;ctx.strokeStyle="#ff9800";ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
    }
  }
}
function drawSnake(){
  if(!snake.length)return;
  const n=snake.length;
  for(let i=n-1;i>=0;i--){
    const s=snake[i];
    const cx=offX+(s.x+.5)*cell,cy=offY+(s.y+.5)*cell;
    const t=i/Math.max(1,n-1);
    const r=cell*(0.46-0.12*t)+(i===0?wobble*cell*0.05:0);
    ctx.fillStyle="rgba(0,0,0,.18)";
    ctx.beginPath();ctx.ellipse(cx,cy+cell*0.12,r,r*0.85,0,0,6.3);ctx.fill();
  }
  for(let i=n-1;i>=0;i--){
    const s=snake[i];
    const cx=offX+(s.x+.5)*cell,cy=offY+(s.y+.5)*cell;
    const t=i/Math.max(1,n-1);
    const r=cell*(0.46-0.12*t)+(i===0?wobble*cell*0.05:0);
    if(i<n-1){
      const p=snake[i+1];
      if(Math.abs(p.x-s.x)+Math.abs(p.y-s.y)===1){
        const px=offX+(p.x+.5)*cell,py=offY+(p.y+.5)*cell;
        ctx.strokeStyle=i%2?"#43c463":"#5ee07a";ctx.lineWidth=r*1.7;ctx.lineCap="round";
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
      }
    }
    const g=ctx.createRadialGradient(cx-r*0.3,cy-r*0.4,r*0.1,cx,cy,r);
    g.addColorStop(0,i%2?"#8cf5a0":"#b6ffc4");g.addColorStop(1,i%2?"#2fa84f":"#3ec35e");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(cx,cy,r,0,6.3);ctx.fill();
    if(i>0&&i%2===0){
      ctx.fillStyle="rgba(255,255,255,.35)";
      ctx.beginPath();ctx.arc(cx,cy,r*0.35,0,6.3);ctx.fill();
    }
  }
  const h=snake[0];
  const cx=offX+(h.x+.5)*cell,cy=offY+(h.y+.5)*cell;
  const d=state===STATE.OVER?{x:0,y:1}:dir;
  const px=-d.y,py=d.x;
  const er=cell*0.17;
  for(const sgn of [-1,1]){
    const ex=cx+d.x*cell*0.14+px*sgn*cell*0.2,ey=cy+d.y*cell*0.14+py*sgn*cell*0.2;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,er,0,6.3);ctx.fill();
    ctx.strokeStyle="#1b4d2a";ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle="#222";
    if(state===STATE.OVER){
      ctx.lineWidth=2;ctx.strokeStyle="#222";
      ctx.beginPath();ctx.moveTo(ex-er*.6,ey-er*.6);ctx.lineTo(ex+er*.6,ey+er*.6);
      ctx.moveTo(ex+er*.6,ey-er*.6);ctx.lineTo(ex-er*.6,ey+er*.6);ctx.stroke();
    }else{
      ctx.beginPath();ctx.arc(ex+d.x*er*0.4,ey+d.y*er*0.4,er*0.55,0,6.3);ctx.fill();
    }
  }
  if(state===STATE.PLAY&&Math.floor(time*3)%3===0){
    ctx.strokeStyle="#ff3d71";ctx.lineWidth=2;ctx.lineCap="round";
    const sx=cx+d.x*cell*0.42,sy=cy+d.y*cell*0.42;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+d.x*cell*0.25,sy+d.y*cell*0.25);ctx.stroke();
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life));
    ctx.font="bold "+Math.floor(cell*0.7)+"px 'Comic Sans MS',sans-serif";
    ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.5)";ctx.strokeText(f.t,f.x,f.y);
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function text(t,x,y,size,color,stroke){
  ctx.font="bold "+size+"px 'Comic Sans MS','Chalkboard SE',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.lineJoin="round";
  ctx.lineWidth=Math.max(3,size*0.14);ctx.strokeStyle=stroke||"#3a1f7a";
  ctx.strokeText(t,x,y);
  ctx.fillStyle=color||"#fff";ctx.fillText(t,x,y);
}
function drawHUD(){
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.fillRect(0,0,W,52);
  const sz=Math.max(14,Math.min(24,W/22));
  ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.font="bold "+sz+"px 'Comic Sans MS',sans-serif";
  ctx.fillStyle="#fff";ctx.fillText("⭐ "+score,14,16);
  ctx.font="bold "+(sz*0.75)+"px 'Comic Sans MS',sans-serif";
  ctx.fillStyle="#ffd9ec";ctx.fillText("🍎 "+fruitsInLevel+"/"+fruitsNeeded,14,38);
  ctx.textAlign="center";
  ctx.font="bold "+sz+"px 'Comic Sans MS',sans-serif";
  ctx.fillStyle="#ffd23f";ctx.fillText("Niveau "+level,W/2,14);
  // barre de temps
  const bw=Math.min(220,W*0.34),bx=W/2-bw/2;
  ctx.fillStyle="rgba(255,255,255,.2)";rr(bx,28,bw,16,8);ctx.fill();
  const pr=Math.max(0,Math.min(1,timeLeft/timeMax));
  const low=timeLeft<8;
  const col=pr>0.5?"#7cf59a":pr>0.25?"#ffd23f":"#ff6b6b";
  if(pr>0){
    ctx.fillStyle=(low&&Math.floor(time*6)%2===0)?"#fff":col;
    rr(bx,28,Math.max(16,bw*pr),16,8);ctx.fill();
  }
  ctx.font="bold 12px 'Comic Sans MS',sans-serif";
  ctx.fillStyle="#2b1b4d";ctx.textAlign="center";
  ctx.fillText("⏱ "+Math.ceil(timeLeft)+" s",W/2,36.5);
  ctx.textAlign="right";ctx.fillStyle="#fff";
  ctx.font="bold "+sz+"px 'Comic Sans MS',sans-serif";
  ctx.fillText("🏆 "+best,W-14,26);
}
function drawHint(){
  if(state!==STATE.PLAY||started)return;
  const msg="Dirige le serpent avec les flèches !";
  const sz=Math.max(14,Math.min(22,W/26));
  ctx.font="bold "+sz+"px 'Comic Sans MS',sans-serif";
  const w=Math.min(W-20,ctx.measureText(msg).width+36);
  const y=offY+ROWS*cell-cell*1.2;
  const p=1+Math.sin(time*5)*0.04;
  ctx.save();ctx.translate(W/2,y);ctx.scale(p,p);
  rr(-w/2,-sz,w,sz*2,sz);ctx.fillStyle="rgba(40,20,90,.8)";ctx.fill();
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(msg,0,0);
  ctx.restore();
}
function overlay(a){ctx.fillStyle="rgba(20,10,50,"+a+")";ctx.fillRect(0,0,W,H);}
function drawTitle(){
  drawBG();
  const cx=W/2,cy=H*0.5;
  const sc=Math.min(W,H)/500;
  ctx.save();ctx.translate(cx,cy-20*sc);ctx.scale(sc,sc);
  for(let i=10;i>=0;i--){
    const x=Math.sin(time*2+i*0.5)*90-i*8+40,y=i*-3+Math.cos(time*3+i*0.6)*12+70;
    const r=34-i*1.5;
    const g=ctx.createRadialGradient(x-r*.3,y-r*.3,3,x,y,r);
    g.addColorStop(0,i%2?"#8cf5a0":"#b6ffc4");g.addColorStop(1,i%2?"#2fa84f":"#3ec35e");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.fill();
    if(i===0){
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(x+8,y-10,10,0,6.3);ctx.arc(x+26,y-8,10,0,6.3);ctx.fill();
      ctx.fillStyle="#222";
      ctx.beginPath();ctx.arc(x+11,y-9,5,0,6.3);ctx.arc(x+29,y-7,5,0,6.3);ctx.fill();
      ctx.strokeStyle="#1b4d2a";ctx.lineWidth=4;ctx.lineCap="round";
      ctx.beginPath();ctx.arc(x+18,y+8,10,0.2,Math.PI-0.2);ctx.stroke();
    }
  }
  ctx.restore();
  const bob=Math.sin(time*3)*6;
  text("Serpent",cx,H*0.15+bob,Math.min(70,W/7),"#ffe14d");
  text("Labyrinthe",cx,H*0.15+Math.min(70,W/7)*0.95+bob,Math.min(70,W/7),"#7cf59a");
  const pulse=1+Math.sin(time*4)*0.06;
  ctx.save();ctx.translate(cx,H*0.76);ctx.scale(pulse,pulse);
  text("Appuie sur Espace ou touche l'écran",0,0,Math.min(26,W/18),"#fff");
  ctx.restore();
  text("Mange les fruits 🍎 avant la fin du temps !",cx,H*0.83,Math.min(20,W/24),"#ffd9ec");
  text("Tu diriges le serpent : garde une flèche appuyée pour avancer",cx,H*0.88,Math.min(18,W/28),"#cfe3ff");
  text("Flèches / WASD ou glisse le doigt",cx,H*0.92,Math.min(18,W/28),"#cfe3ff");
  if(best>0)text("Meilleur score : "+best,cx,H*0.96,Math.min(20,W/24),"#ffd23f");
}
function drawOver(){
  overlay(0.55);
  const cx=W/2,cy=H/2;
  const bw=Math.min(W*0.86,440),bh=Math.min(H*0.7,300);
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.5)";ctx.shadowBlur=24;
  rr(cx-bw/2,cy-bh/2,bw,bh,28);
  const g=ctx.createLinearGradient(0,cy-bh/2,0,cy+bh/2);
  g.addColorStop(0,"#ff9ecb");g.addColorStop(1,"#a77bff");
  ctx.fillStyle=g;ctx.fill();ctx.restore();
  const u=bh/300;
  text("Temps écoulé !",cx,cy-bh*0.32,Math.min(40,bw/10),"#fff");
  text("Score : "+score,cx,cy-bh*0.1,Math.min(30,bw/13),"#fff9c4");
  text("Meilleur : "+best,cx,cy+bh*0.05,Math.min(26,bw/15),"#ffe14d");
  const pulse=1+Math.sin(time*5)*0.06;
  ctx.save();ctx.translate(cx,cy+bh*0.27);ctx.scale(pulse,pulse);
  rr(-bw*0.36,-26*u,bw*0.72,52*u,26*u);ctx.fillStyle="#46d37a";ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle="#fff";ctx.stroke();
  text("Rejouer (Espace)",0,0,Math.min(24,bw/16),"#fff","#1f7a45");
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(state===STATE.TITLE){drawTitle();return;}
  ctx.save();
  if(shake>0){
    const m=shake*18;
    ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);
  }
  drawBG();
  drawMaze();
  drawFood();
  drawSnake();
  drawParticles();
  ctx.restore();
  drawHUD();
  drawHint();
  if(flash>0){ctx.fillStyle="rgba(255,255,255,"+(flash*0.5).toFixed(2)+")";ctx.fillRect(0,0,W,H);}
  if(state===STATE.OVER)drawOver();
}

/* ---------- Boucle ---------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1;
  if(dt<0)dt=0;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
