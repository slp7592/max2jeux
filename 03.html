<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Archer des Étoiles</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#140a2e;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:14px;pointer-events:none}
  .grp{display:flex;gap:12px;pointer-events:none}
  .btn{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:rgba(255,200,60,.55);color:#fff;font-size:34px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none;cursor:pointer}
  .btn:active,.btn.on{background:rgba(255,120,60,.85);transform:translateY(3px)}
  #fire{width:100px;height:100px;font-size:18px;background:rgba(255,90,140,.6)}
  @media (hover:hover) and (pointer:fine){#ctrl{opacity:.55}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ctrl">
  <div class="grp">
    <div class="btn" id="bl">◀</div>
    <div class="btn" id="br">▶</div>
  </div>
  <div class="btn" id="fire">TIRE !</div>
</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(player)player.y=H-Math.min(150,H*.22);
}
window.addEventListener("resize",resize);

/* ---------- Audio ---------- */
let AC=null,master=null;
function initAudio(){
  if(AC){if(AC.state==="suspended")AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);
  }catch(e){AC=null;}
}
function tone(f1,f2,dur,type,vol,delay){
  if(!AC)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine";
  o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol||.3,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+dur+.02);
}
const sfx={
  shoot(){tone(700,220,.14,"triangle",.25)},
  hit(){tone(500,900,.12,"square",.18);tone(800,1300,.12,"sine",.15,.07)},
  golden(){[600,800,1000,1300].forEach((f,i)=>tone(f,f*1.1,.12,"sine",.2,i*.06))},
  ouch(){tone(300,90,.35,"sawtooth",.25)},
  miss(){tone(260,200,.1,"sine",.1)},
  over(){[400,330,260,180].forEach((f,i)=>tone(f,f*.9,.25,"triangle",.25,i*.17))},
  start(){[400,500,650,800].forEach((f,i)=>tone(f,f,.1,"square",.12,i*.07))},
  level(){[500,700,900].forEach((f,i)=>tone(f,f*1.05,.12,"triangle",.2,i*.08))}
};

/* ---------- Entrées ---------- */
const keys={left:false,right:false,fire:false};
const KM={ArrowLeft:"left",KeyA:"left",KeyQ:"left",ArrowRight:"right",KeyD:"right",Space:"fire",ArrowUp:"fire",KeyW:"fire",KeyZ:"fire"};
window.addEventListener("keydown",e=>{
  const k=KM[e.code];
  if(k){e.preventDefault();keys[k]=true;initAudio();
    if(k==="fire"&&(state==="title"||state==="over")&&!e.repeat)startGame();
  }
  if(e.code==="Enter"&&(state==="title"||state==="over")){initAudio();startGame();}
  if(e.code==="KeyP"||e.code==="Escape"){if(state==="play")state="pause";else if(state==="pause")state="play";}
});
window.addEventListener("keyup",e=>{const k=KM[e.code];if(k){keys[k]=false;}});
function bindBtn(id,k){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();initAudio();keys[k]=true;el.classList.add("on");
    if(k==="fire"&&(state==="title"||state==="over"))startGame();};
  const off=e=>{e.preventDefault();keys[k]=false;el.classList.remove("on");};
  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("pointerleave",off);
}
bindBtn("bl","left");bindBtn("br","right");bindBtn("fire","fire");
cv.addEventListener("pointerdown",e=>{
  initAudio();
  if(state==="title"||state==="over"){
    if(state==="over"&&overTimer<.6)return;
    startGame();
  }else if(state==="pause")state="play";
});
window.addEventListener("blur",()=>{keys.left=keys.right=keys.fire=false;if(state==="play")state="pause";});

/* ---------- État ---------- */
let state="title",player=null;
let best=0,score=0,lives=3,level=1,time=0,shake=0,overTimer=0;
let arrows=[],targets=[],parts=[],floaters=[],stars=[],clouds=[];
let spawnT=0,combo=0,comboT=0,levelT=0,banner=0,bannerText="";
let hitCount=0,shotCount=0;

function rand(a,b){return a+Math.random()*(b-a)}
function resetPlayer(){player={x:W/2,y:H-Math.min(150,H*.22),vx:0,cool:0,recoil:0,blink:0,inv:0}}
resetPlayer();
function makeBg(){
  stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),s:rand(.5,2.6),t:Math.random()*6,v:rand(6,26)});
  clouds=[];for(let i=0;i<6;i++)clouds.push({x:Math.random(),y:Math.random()*.7,s:rand(.6,1.4),v:rand(6,16)});
}
makeBg();
resize();

function startGame(){
  state="play";score=0;lives=3;level=1;time=0;spawnT=1;combo=0;comboT=0;
  arrows=[];targets=[];parts=[];floaters=[];hitCount=0;shotCount=0;levelT=0;
  resetPlayer();sfx.start();banner=2;bannerText="Niveau 1";
}

/* ---------- Cibles ---------- */
const COLORS=[["#ff7a59","#ff3d6e"],["#5ad1ff","#3a7bff"],["#9cff6b","#2fc46a"],["#ffd84a","#ff9f1c"],["#d58bff","#8a4dff"]];
function spawnTarget(){
  const r=rand(0,1);
  let type="ufo";
  if(r<.12)type="gold";
  else if(r<.12+Math.min(.18,level*.025))type="bomb";
  else if(r<.55)type="balloon";
  const size=type==="gold"?26:rand(28,44);
  const dir=Math.random()<.5?1:-1;
  const sp=(60+level*14+rand(0,50))*(type==="gold"?1.7:1);
  const t={
    type,size,x:dir>0?-size:W+size,y:rand(70,H*.5),
    vx:dir*sp,vy:0,base:0,ph:Math.random()*6,amp:rand(15,60)*(type==="bomb"?.5:1),
    col:COLORS[(Math.random()*COLORS.length)|0],age:0,hp:1,wob:0
  };
  t.base=t.y;
  if(type==="balloon"){t.vx*=.7;t.y=H*.55+rand(0,H*.1);t.base=t.y;t.vy=-30-level*3;t.vx=dir*rand(30,70);t.x=rand(40,W-40);}
  targets.push(t);
}

/* ---------- Particules ---------- */
function burst(x,y,col,n,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=rand(.3,1)*(sp||260);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(.4,.9),max:.9,c:col,r:rand(2,6),type:Math.random()<.4?"star":"dot",rot:Math.random()*6});
  }
}
function floatText(x,y,txt,col){floaters.push({x,y,txt,col,life:1})}

/* ---------- Mise à jour ---------- */
function update(dt){
  time+=dt;
  // fond
  for(const s of stars){s.t+=dt;s.y+=s.v*dt/H;if(s.y>1){s.y=0;s.x=Math.random();}}
  for(const c of clouds){c.x+=c.v*dt/W;if(c.x>1.2)c.x=-.2}
  shake=Math.max(0,shake-dt*30);
  if(banner>0)banner-=dt;

  if(state!=="play")return;

  // niveau
  levelT+=dt;
  if(levelT>18){levelT=0;level++;bannerText="Niveau "+level;banner=2;sfx.level();}

  // joueur
  const acc=(keys.right?1:0)-(keys.left?1:0);
  const maxV=420+level*8;
  player.vx+=(acc*maxV-player.vx)*Math.min(1,dt*10);
  player.x+=player.vx*dt;
  player.x=Math.max(40,Math.min(W-40,player.x));
  player.cool-=dt;player.recoil=Math.max(0,player.recoil-dt*5);
  player.inv=Math.max(0,player.inv-dt);
  player.blink-=dt;if(player.blink<-3)player.blink=.15;
  if(keys.fire&&player.cool<=0){
    arrows.push({x:player.x,y:player.y-50,vy:-780,rot:0});
    player.cool=.32;player.recoil=1;shotCount++;sfx.shoot();
  }

  // flèches
  for(const a of arrows){a.y+=a.vy*dt;if(Math.random()<.6)parts.push({x:a.x,y:a.y+20,vx:rand(-20,20),vy:rand(20,60),life:.3,max:.3,c:"#fff3b0",r:2.5,type:"dot",rot:0});}
  for(let i=arrows.length-1;i>=0;i--){
    if(arrows[i].y<-40){arrows.splice(i,1);combo=0;sfx.miss();}
  }

  // apparition cibles
  spawnT-=dt;
  if(spawnT<=0){
    spawnTarget();
    spawnT=Math.max(.45,1.3-level*.07)*rand(.7,1.2);
  }

  // cibles
  for(const t of targets){
    t.age+=dt;t.wob+=dt;
    if(t.type==="balloon"){
      t.x+=t.vx*dt+Math.sin(t.age*2+t.ph)*30*dt;
      t.y+=t.vy*dt;
    }else{
      t.x+=t.vx*dt;
      t.y=t.base+Math.sin(t.age*2.2+t.ph)*t.amp;
    }
  }
  // collisions flèche/cible
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i];let hit=false;
    for(let j=targets.length-1;j>=0;j--){
      const t=targets[j];
      const dx=a.x-t.x,dy=a.y-t.y;
      if(dx*dx+dy*dy<(t.size+6)*(t.size+6)){
        hit=true;onHit(t);targets.splice(j,1);break;
      }
    }
    if(hit)arrows.splice(i,1);
  }
  // sortie d'écran
  for(let j=targets.length-1;j>=0;j--){
    const t=targets[j];
    if(t.x<-90||t.x>W+90||t.y<-90){
      targets.splice(j,1);
    }
  }
  // particules
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.rot+=dt*8;}
  parts=parts.filter(p=>p.life>0);
  for(const f of floaters){f.life-=dt;f.y-=40*dt;}
  floaters=floaters.filter(f=>f.life>0);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
}
function onHit(t){
  hitCount++;
  if(t.type==="bomb"){
    lives--;shake=14;sfx.ouch();combo=0;
    burst(t.x,t.y,"#555",26,320);burst(t.x,t.y,"#ffb03a",16,300);
    floatText(t.x,t.y,"Aïe ! −1 ❤","#ff6b6b");
    player.inv=1;
    if(lives<=0)gameOver();
    return;
  }
  combo++;comboT=2.2;
  const mult=1+Math.min(4,Math.floor(combo/3));
  let pts=(t.type==="gold"?50:t.type==="balloon"?15:10)*mult;
  score+=pts;
  if(score>best)best=score;
  shake=Math.max(shake,t.type==="gold"?7:4);
  if(t.type==="gold"){sfx.golden();burst(t.x,t.y,"#ffe14a",30,340);
    if(lives<5&&Math.random()<.4){lives++;floatText(t.x,t.y-26,"+1 ❤","#ff7aa8");}}
  else{sfx.hit();burst(t.x,t.y,t.col[0],18,280);}
  floatText(t.x,t.y,"+"+pts+(mult>1?" x"+mult:""),"#fff");
}
function gameOver(){
  state="over";overTimer=0;sfx.over();
  if(score>best)best=score;
}

/* ---------- Dessin ---------- */
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#1b0b4a");g.addColorStop(.55,"#5b2a8f");g.addColorStop(1,"#ff8fb1");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // lune
  const mx=W*.82,my=H*.18,mr=Math.min(W,H)*.09;
  const mg=ctx.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);
  mg.addColorStop(0,"#fffbe0");mg.addColorStop(1,"#ffd77a");
  ctx.shadowColor="#ffe9a0";ctx.shadowBlur=40;ctx.fillStyle=mg;
  ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle="rgba(200,150,60,.35)";
  ctx.beginPath();ctx.arc(mx-mr*.3,my+mr*.2,mr*.18,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(mx+mr*.25,my-mr*.2,mr*.12,0,7);ctx.fill();
  // étoiles
  for(const s of stars){
    const a=.5+.5*Math.sin(s.t*2);
    ctx.globalAlpha=.4+a*.6;ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.s,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  // nuages
  for(const c of clouds)drawCloud(c.x*W,c.y*H,c.s);
  // sol : collines
  const gy=H-Math.min(90,H*.14);
  ctx.fillStyle="#3c1d6b";
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=20)ctx.lineTo(x,gy-20+Math.sin(x*.01+1)*18+Math.sin(x*.027)*8);
  ctx.lineTo(W,H);ctx.fill();
  const gg=ctx.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,"#53d68a");gg.addColorStop(1,"#1f8f5a");
  ctx.fillStyle=gg;
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=20)ctx.lineTo(x,gy+Math.sin(x*.015)*10);
  ctx.lineTo(W,H);ctx.fill();
}
function drawCloud(x,y,s){
  ctx.fillStyle="rgba(255,255,255,.22)";
  ctx.beginPath();
  ctx.arc(x,y,24*s,0,7);ctx.arc(x+26*s,y-8*s,30*s,0,7);ctx.arc(x+55*s,y,22*s,0,7);ctx.arc(x+26*s,y+8*s,26*s,0,7);
  ctx.fill();
}
function outline(){ctx.lineWidth=4;ctx.strokeStyle="#2a1550";ctx.lineJoin="round";ctx.lineCap="round";}

function drawTarget(t){
  ctx.save();ctx.translate(t.x,t.y);
  const s=t.size;
  ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  outline();
  if(t.type==="ufo"){
    ctx.rotate(Math.sin(t.wob*3)*.1);
    // dôme
    const dg=ctx.createRadialGradient(-s*.2,-s*.6,2,0,-s*.3,s*.7);
    dg.addColorStop(0,"#e8fbff");dg.addColorStop(1,"#6fd0ff");
    ctx.fillStyle=dg;ctx.beginPath();ctx.ellipse(0,-s*.2,s*.5,s*.55,0,Math.PI,0);ctx.fill();ctx.stroke();
    // petit alien
    ctx.shadowColor="transparent";
    ctx.fillStyle="#7dff7d";ctx.beginPath();ctx.arc(0,-s*.3,s*.22,0,7);ctx.fill();
    ctx.fillStyle="#222";ctx.beginPath();ctx.arc(-s*.08,-s*.33,2.5,0,7);ctx.arc(s*.08,-s*.33,2.5,0,7);ctx.fill();
    ctx.shadowColor="rgba(0,0,0,.35)";
    // corps
    const bg=ctx.createLinearGradient(0,-s*.3,0,s*.4);
    bg.addColorStop(0,t.col[0]);bg.addColorStop(1,t.col[1]);
    ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,s,s*.38,0,0,7);ctx.fill();ctx.stroke();
    ctx.shadowColor="transparent";
    for(let i=-1;i<=1;i++){
      ctx.fillStyle=(Math.floor(t.wob*4)+i)%2?"#fff7a8":"#fff";
      ctx.beginPath();ctx.arc(i*s*.5,s*.03,s*.08,0,7);ctx.fill();
    }
  }else if(t.type==="balloon"){
    const bg=ctx.createRadialGradient(-s*.3,-s*.3,2,0,0,s*1.1);
    bg.addColorStop(0,"#fff");bg.addColorStop(.25,t.col[0]);bg.addColorStop(1,t.col[1]);
    ctx.fillStyle=bg;
    ctx.beginPath();ctx.ellipse(0,0,s*.8,s,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=t.col[1];ctx.beginPath();ctx.moveTo(0,s);ctx.lineTo(-6,s+9);ctx.lineTo(6,s+9);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.shadowColor="transparent";
    ctx.beginPath();ctx.moveTo(0,s+9);
    for(let i=1;i<=5;i++)ctx.lineTo(Math.sin(t.wob*4+i)*5,s+9+i*5);
    ctx.lineWidth=2;ctx.stroke();
    // visage
    ctx.fillStyle="#2a1550";
    ctx.beginPath();ctx.arc(-s*.25,-s*.1,3,0,7);ctx.arc(s*.25,-s*.1,3,0,7);ctx.fill();
    ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,s*.1,s*.25,.2,Math.PI-.2);ctx.stroke();
  }else if(t.type==="gold"){
    ctx.rotate(t.wob*3);
    ctx.shadowColor="#ffe14a";ctx.shadowBlur=24;
    const gg=ctx.createRadialGradient(-4,-4,2,0,0,s*1.2);
    gg.addColorStop(0,"#fffbd0");gg.addColorStop(1,"#ffb800");
    ctx.fillStyle=gg;
    ctx.beginPath();
    for(let i=0;i<10;i++){const r=i%2?s*.5:s*1.1,a=i/10*Math.PI*2-Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.rotate(-t.wob*3);ctx.shadowColor="transparent";
    ctx.fillStyle="#2a1550";ctx.beginPath();ctx.arc(-5,-2,2.5,0,7);ctx.arc(5,-2,2.5,0,7);ctx.fill();
    ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,2,5,.2,Math.PI-.2);ctx.stroke();
  }else if(t.type==="bomb"){
    ctx.rotate(Math.sin(t.wob*5)*.15);
    const bg=ctx.createRadialGradient(-s*.3,-s*.3,2,0,0,s);
    bg.addColorStop(0,"#8a8a9a");bg.addColorStop(1,"#26262e");
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,s*.85,0,7);ctx.fill();ctx.stroke();
    ctx.shadowColor="transparent";
    ctx.beginPath();ctx.moveTo(0,-s*.85);ctx.quadraticCurveTo(8,-s*1.2,16,-s*1.1);ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=Math.floor(t.wob*10)%2?"#ffdd44":"#ff6b3a";
    ctx.beginPath();ctx.arc(16,-s*1.1,5,0,7);ctx.fill();
    // yeux fâchés
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-s*.28,-s*.05,s*.17,0,7);ctx.arc(s*.28,-s*.05,s*.17,0,7);ctx.fill();
    ctx.fillStyle="#222";ctx.beginPath();ctx.arc(-s*.25,-s*.02,3,0,7);ctx.arc(s*.25,-s*.02,3,0,7);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-s*.5,-s*.3);ctx.lineTo(-s*.1,-s*.18);ctx.moveTo(s*.5,-s*.3);ctx.lineTo(s*.1,-s*.18);ctx.stroke();
  }
  ctx.restore();
}

function drawArrow(a){
  ctx.save();ctx.translate(a.x,a.y);
  ctx.shadowColor="rgba(255,240,150,.9)";ctx.shadowBlur=12;
  ctx.strokeStyle="#7a4a1c";ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,34);ctx.stroke();
  ctx.fillStyle="#e9eef5";ctx.strokeStyle="#2a1550";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(-8,-2);ctx.lineTo(8,-2);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle="#ff5c8a";
  ctx.beginPath();ctx.moveTo(0,26);ctx.lineTo(-9,40);ctx.lineTo(0,34);ctx.lineTo(9,40);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  if(player.inv>0&&Math.floor(time*20)%2)return;
  const p=player;
  ctx.save();ctx.translate(p.x,p.y);
  const lean=p.vx/900;ctx.rotate(lean);
  ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=12;ctx.shadowOffsetY=6;
  outline();
  // fusée-nuage sous le héros
  const bob=Math.sin(time*5)*3;
  ctx.translate(0,bob);
  // flammes
  ctx.shadowColor="transparent";
  const fl=10+Math.sin(time*30)*4;
  const fg=ctx.createLinearGradient(0,30,0,30+fl+20);
  fg.addColorStop(0,"#ffe14a");fg.addColorStop(1,"rgba(255,80,60,0)");
  ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(-14,30);ctx.lineTo(0,50+fl);ctx.lineTo(14,30);ctx.fill();
  ctx.shadowColor="rgba(0,0,0,.4)";
  // vaisseau
  const sg=ctx.createLinearGradient(-30,0,30,0);
  sg.addColorStop(0,"#ff8a3d");sg.addColorStop(.5,"#ffd25a");sg.addColorStop(1,"#ff8a3d");
  ctx.fillStyle=sg;
  ctx.beginPath();ctx.moveTo(0,-10);ctx.bezierCurveTo(40,0,44,28,30,34);ctx.lineTo(-30,34);ctx.bezierCurveTo(-44,28,-40,0,0,-10);ctx.fill();ctx.stroke();
  // ailes
  ctx.fillStyle="#ff5c8a";
  ctx.beginPath();ctx.moveTo(-34,20);ctx.lineTo(-52,38);ctx.lineTo(-26,34);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(34,20);ctx.lineTo(52,38);ctx.lineTo(26,34);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowColor="transparent";
  // pilote (lapin)
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.ellipse(-8,-34,6,18,-.15,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(8,-34,6,18,.15,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle="#ffb3c8";
  ctx.beginPath();ctx.ellipse(-8,-34,2.5,12,-.15,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(8,-34,2.5,12,.15,0,7);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,-8,19,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle="#2a1550";
  const eh=p.blink>0?1:5;
  ctx.beginPath();ctx.ellipse(-7,-10,3.5,eh,0,0,7);ctx.ellipse(7,-10,3.5,eh,0,0,7);ctx.fill();
  ctx.fillStyle="#ff8fb1";ctx.beginPath();ctx.arc(0,-3,3,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,120,150,.5)";ctx.beginPath();ctx.arc(-13,-2,4,0,7);ctx.arc(13,-2,4,0,7);ctx.fill();
  // arc
  const pull=p.recoil*8;
  ctx.strokeStyle="#7a4a1c";ctx.lineWidth=6;
  ctx.beginPath();ctx.arc(0,-8-pull*0,34,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  ctx.strokeStyle="#fff";ctx.lineWidth=2;
  const ax=Math.cos(Math.PI*1.15)*34,ay=-8+Math.sin(Math.PI*1.15)*34;
  const bx=Math.cos(Math.PI*1.85)*34;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(0,ay+10+pull);ctx.lineTo(bx,ay);ctx.stroke();
  ctx.restore();
}

function drawParts(){
  for(const p of parts){
    const a=Math.max(0,p.life/p.max);
    ctx.globalAlpha=a;ctx.fillStyle=p.c;
    if(p.type==="star"){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.beginPath();
      for(let i=0;i<8;i++){const r=i%2?p.r*.5:p.r*1.6,an=i/8*Math.PI*2;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}
      ctx.closePath();ctx.fill();ctx.restore();
    }else{ctx.beginPath();ctx.arc(p.x,p.y,p.r*a+.5,0,7);ctx.fill();}
  }
  ctx.globalAlpha=1;
}
function drawFloaters(){
  ctx.textAlign="center";ctx.font="bold 22px 'Comic Sans MS',system-ui,sans-serif";
  for(const f of floaters){
    ctx.globalAlpha=Math.min(1,f.life*1.5);
    ctx.lineWidth=5;ctx.strokeStyle="#2a1550";ctx.strokeText(f.txt,f.x,f.y);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function textOut(txt,x,y,size,fill,align){
  ctx.textAlign=align||"center";
  ctx.font="bold "+size+"px 'Comic Sans MS','Chalkboard SE',system-ui,sans-serif";
  ctx.lineWidth=Math.max(4,size/6);ctx.strokeStyle="#2a1550";ctx.lineJoin="round";
  ctx.strokeText(txt,x,y);ctx.fillStyle=fill||"#fff";ctx.fillText(txt,x,y);
}
function heart(x,y,s,col){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=col;ctx.strokeStyle="#2a1550";ctx.lineWidth=2.5/s;
  ctx.beginPath();ctx.moveTo(0,6);
  ctx.bezierCurveTo(-14,-4,-8,-14,0,-6);ctx.bezierCurveTo(8,-14,14,-4,0,6);
  ctx.fill();ctx.stroke();ctx.restore();
}
function drawHUD(){
  textOut("Score : "+score,14,38,28,"#fff","left");
  textOut("Record : "+best,14,68,18,"#ffe14a","left");
  for(let i=0;i<lives;i++)heart(W-28-i*34,30,1.4,"#ff4d7d");
  textOut("Niveau "+level,W-14,66,18,"#9cf0ff","right");
  if(combo>=3){
    const m=1+Math.min(4,Math.floor(combo/3));
    textOut("Combo x"+m+" !",W/2,40,24+Math.sin(time*12)*2,"#ffd84a");
  }
  if(banner>0&&state==="play"){
    ctx.globalAlpha=Math.min(1,banner);
    textOut(bannerText,W/2,H*.3,Math.min(64,W/8),"#fff");
    ctx.globalAlpha=1;
  }
}
function panel(w,h){
  const x=W/2-w/2,y=H/2-h/2;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=24;ctx.shadowOffsetY=10;
  ctx.fillStyle="rgba(40,20,90,.82)";
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,28);else ctx.rect(x,y,w,h);
  ctx.fill();ctx.shadowColor="transparent";
  ctx.lineWidth=4;ctx.strokeStyle="#ffd84a";ctx.stroke();
  ctx.restore();
}
function drawTitle(){
  const pw=Math.min(560,W-30),ph=Math.min(400,H-170);
  panel(pw,ph);
  const ts=Math.min(56,pw/9);
  const cy=H/2-ph/2;
  ctx.save();ctx.translate(W/2,cy+ph*.2);ctx.rotate(Math.sin(time*2)*.03);
  textOut("Archer des Étoiles",0,0,ts,"#ffd84a");ctx.restore();
  textOut("Tire sur les cibles rigolotes !",W/2,cy+ph*.36,Math.min(22,pw/20),"#fff");
  textOut("Évite les bombes grincheuses 💣",W/2,cy+ph*.46,Math.min(20,pw/22),"#ffb3c8");
  textOut("Étoile dorée = gros points !",W/2,cy+ph*.56,Math.min(20,pw/22),"#ffe14a");
  textOut("◀ ▶ / A D : bouger   Espace : tirer",W/2,cy+ph*.68,Math.min(17,pw/26),"#9cf0ff");
  textOut("Record : "+best,W/2,cy+ph*.78,20,"#fff");
  const s=1+Math.sin(time*5)*.05;
  ctx.save();ctx.translate(W/2,cy+ph*.91);ctx.scale(s,s);
  textOut("Touche pour jouer !",0,0,Math.min(28,pw/14),"#7dff9a");ctx.restore();
}
function drawOver(){
  const pw=Math.min(520,W-30),ph=Math.min(360,H-170);
  panel(pw,ph);
  const cy=H/2-ph/2;
  textOut("Partie terminée !",W/2,cy+ph*.2,Math.min(46,pw/10),"#ff8fb1");
  textOut("Score : "+score,W/2,cy+ph*.38,34,"#fff");
  const nb=score>0&&score>=best;
  textOut(nb?"🏆 Nouveau record !":"Record : "+best,W/2,cy+ph*.52,24,"#ffe14a");
  const acc=shotCount?Math.round(hitCount/shotCount*100):0;
  textOut("Précision : "+acc+" %",W/2,cy+ph*.65,20,"#9cf0ff");
  if(overTimer>.6){
    const s=1+Math.sin(time*5)*.05;
    ctx.save();ctx.translate(W/2,cy+ph*.86);ctx.scale(s,s);
    textOut("Rejouer (Espace / touche)",0,0,Math.min(26,pw/14),"#7dff9a");ctx.restore();
  }
}
function drawPause(){
  ctx.fillStyle="rgba(20,10,50,.6)";ctx.fillRect(0,0,W,H);
  textOut("Pause",W/2,H/2-10,56,"#ffd84a");
  textOut("Touche P ou toucher l'écran pour continuer",W/2,H/2+34,20,"#fff");
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake)*.5,rand(-shake,shake)*.5);
  drawBg();
  for(const t of targets)drawTarget(t);
  for(const a of arrows)drawArrow(a);
  if(state!=="title")drawPlayer();
  else{ // petit décor animé
    player.x=W/2+Math.sin(time*1.2)*W*.3;
  }
  drawParts();drawFloaters();
  ctx.restore();
  if(state==="play"||state==="pause"||state==="over")drawHUD();
  if(state==="title")drawTitle();
  if(state==="over")drawOver();
  if(state==="pause")drawPause();
}

/* ---------- Boucle ---------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;
  if(dt>.05)dt=.05;if(dt<0)dt=0;
  if(state==="title"){time+=dt;for(const s of stars){s.t+=dt;s.y+=s.v*dt/H;if(s.y>1){s.y=0;s.x=Math.random();}}
    for(const c of clouds){c.x+=c.v*dt/W;if(c.x>1.2)c.x=-.2}}
  else if(state==="over"){
    overTimer+=dt;time+=dt;
    for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.rot+=dt*8;}
    parts=parts.filter(p=>p.life>0);
    for(const t of targets){t.x+=t.vx*dt*.3;}
    shake=Math.max(0,shake-dt*30);
    for(const s of stars){s.t+=dt;}
  }else update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
